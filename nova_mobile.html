<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N.O.V.A.</title>
<style>
  :root {
    --bg-primary: #0A0E17;
    --bg-panel: #10141F;
    --bubble-nova: #1B2233;
    --bubble-nova-border: #3A3F63;
    --bubble-user: #6C5CE7;
    --text-primary: #E8EAF0;
    --text-dim: #7A8099;
    --accent: #7C5CFC;
    --accent-hover: #6A4CE0;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #top-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-panel);
    margin: 10px; padding: 10px 14px;
    border-radius: 10px;
  }
  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #5A6079; flex-shrink: 0;
    transition: background 0.2s ease;
  }
  #status-text {
    font-family: Consolas, monospace;
    font-size: 12px; color: var(--text-dim);
    letter-spacing: 0.5px; text-transform: uppercase;
    flex: 1;
  }

  #chat {
    flex: 1; overflow-y: auto;
    padding: 6px 16px;
    display: flex; flex-direction: column;
    -webkit-overflow-scrolling: touch;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    margin: 4px 0;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble.you {
    align-self: flex-end;
    background: var(--bubble-user);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bubble.nova {
    align-self: flex-start;
    background: var(--bubble-nova);
    border: 1px solid var(--bubble-nova-border);
    color: var(--text-primary);
    border-bottom-left-radius: 4px;
  }

  #input-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-panel);
    margin: 10px; padding: 8px;
    border-radius: 10px;
  }
  #text-input {
    flex: 1; border: 1px solid var(--bubble-nova-border);
    background: var(--bg-primary); color: var(--text-primary);
    border-radius: 8px; padding: 10px 12px; font-size: 15px;
    outline: none;
  }
  button {
    border: none; border-radius: 8px;
    background: var(--accent); color: white;
    font-size: 14px; font-weight: 600;
    padding: 10px 14px; cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  button:active { transform: scale(0.95); background: var(--accent-hover); }
  #mic-button.recording { background: #E06464; }
</style>
</head>
<body>
<div id="app">
  <div id="top-row">
    <div id="status-dot"></div>
    <div id="status-text">CONNECTING...</div>
  </div>

  <div id="chat"></div>

  <div id="input-row">
    <button id="mic-button">🎤</button>
    <input id="text-input" type="text" placeholder="Type a message to NOVA..." />
    <button id="send-button">Send</button>
  </div>
</div>

<script>
const chatEl = document.getElementById('chat');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const textInput = document.getElementById('text-input');
const sendButton = document.getElementById('send-button');
const micButton = document.getElementById('mic-button');

const STATUS_COLORS = {
  idle: '#5A6079', listening: '#7C5CFC', thinking: '#E0A64B',
  speaking: '#3FD6B5', offline: '#E06464',
};

function setStatus(text, state) {
  statusText.textContent = text.toUpperCase();
  statusDot.style.background = STATUS_COLORS[state] || STATUS_COLORS.idle;
}

function addBubble(sender, text) {
  const div = document.createElement('div');
  div.className = 'bubble ' + (sender === 'you' ? 'you' : 'nova');
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const messages = await res.json();
    messages.forEach(m => addBubble(m.role === 'user' ? 'you' : 'nova', m.content));
    setStatus('Ready', 'idle');
  } catch (e) {
    setStatus('Server unreachable', 'offline');
  }
}

async function speak(text) {
  setStatus('Speaking...', 'speaking');
  try {
    const res = await fetch('/api/speak', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    await new Promise((resolve) => {
      audio.onended = resolve;
      audio.onerror = resolve;
      audio.play();
    });
  } catch (e) { /* if TTS fails, still show the text reply */ }
  setStatus('Ready', 'idle');
}

async function sendMessage(text) {
  if (!text.trim()) return;
  addBubble('you', text);
  setStatus('Thinking...', 'thinking');
  try {
    const res = await fetch('/api/message', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
    const data = await res.json();
    addBubble('nova', data.reply);
    await speak(data.reply);
  } catch (e) {
    addBubble('nova', "Couldn't reach the server. Is nova_server.py running?");
    setStatus('Server unreachable', 'offline');
  }
}

sendButton.onclick = () => {
  const text = textInput.value;
  textInput.value = '';
  sendMessage(text);
};
textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendButton.onclick();
});

// --- Voice recording (mic button) ---
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();
    isRecording = true;
    micButton.classList.add('recording');
    setStatus('Listening...', 'listening');
  } catch (e) {
    setStatus('Mic permission denied', 'offline');
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
    micButton.classList.remove('recording');
  }
}

async function onRecordingStop() {
  setStatus('Transcribing...', 'thinking');
  const blob = new Blob(audioChunks, {type: 'audio/webm'});
  const formData = new FormData();
  formData.append('audio', blob, 'recording.webm');

  try {
    const res = await fetch('/api/transcribe', {method: 'POST', body: formData});
    const data = await res.json();
    if (data.text) {
      await sendMessage(data.text);
    } else {
      setStatus('Ready', 'idle');
    }
  } catch (e) {
    setStatus('Server unreachable', 'offline');
  }
}

// Tap to start, tap again to stop (simpler than press-and-hold on mobile)
micButton.addEventListener('click', () => {
  if (isRecording) stopRecording();
  else startRecording();
});

loadHistory();
</script>
</body>
</html>
